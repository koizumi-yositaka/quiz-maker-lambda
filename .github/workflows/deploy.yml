name: Deploy CDK Stack

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  id-token: write
  contents: read
  

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: prod
    env:
      AWS_ACCOUNT: 260337063361
      AWS_REGION: us-east-1
      ECR_REPO: 260337063361.dkr.ecr.us-east-1.amazonaws.com/generate-quiz-ai-ecr
      DB_HOST: db-cluster-mmh.cluster-cmjvlwsjoinn.us-east-1.rds.amazonaws.com
      DB_NAME: mw_db
      DB_USER: admin
      DB_PASSWORD: mmh-test
      VPC_ID: vpc-0602b47b
      LAMBDA_SG_ID: sg-05d40a37b9b87defd
      USER_POOL_ID: us-east-1_gx1b4cmF7
      SUBNET_ID: subnet-841b2ec9
      OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
      S3_BUCKET: quiz-src-bucket-ky-dev
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Install CDK app deps
        run: |
          cd ./cdk && npm ci
        
      - name: Build Layers
        run: |
          pushd ./layers/common
          npm install
          npm run build
          printf "*\n!nodejs/**\n" > .npmignore
          popd
      - name: Build Lambdas
        run: |
    
          cd ./lambdas/getQuiz && npm install && npm run build:cdk && cd ../..
          cd ./lambdas/createQuiz && npm install && npm run build:cdk && cd ../..
          cd ./lambdas/distributeQuiz && npm install && npm run build:cdk && cd ../..
          cd ./lambdas/answerQuiz && npm install && npm run build:cdk && cd ../..
          cd ./lambdas/getSituation && npm install && npm run build:cdk && cd ../..

      - name: Set STAGE
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              echo "STAGE=prod" >> $GITHUB_ENV
            else
              echo "STAGE=dev" >> $GITHUB_ENV
            fi
          else
            # push イベントなら ref_name から直接取得（main→prod / dev→dev）
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              echo "STAGE=prod" >> $GITHUB_ENV
            else
              echo "STAGE=dev" >> $GITHUB_ENV
            fi
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check changes in lambdas/generateQuiz
        id: gen_changed
        run: |
          set -e
          BASE_REF="${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}"
          if [ "${{ github.event_name }}" != "push" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
          fi
          if git diff --quiet "$BASE_REF" "${{ github.sha }}" -- lambdas/generateQuiz; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to Amazon ECR
        if: steps.gen_changed.outputs.changed == 'true'
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 260337063361.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Set IMAGE_TAG to commit SHA
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and Push generateQuiz Lambda image (immutable tag)
        if: steps.gen_changed.outputs.changed == 'true'
        run: |
          echo "Building image with tag: ${IMAGE_TAG}"
          docker build -t $ECR_REPO:${IMAGE_TAG} ./lambdas/generateQuiz
          docker push $ECR_REPO:${IMAGE_TAG}

      - name: CDK Diff
        if: github.event_name == 'pull_request'
        run: |
          echo "STAGE: $STAGE"
          cd ./cdk && npx aws-cdk diff --all || true
      - name: CDK Deploy
        if: github.event_name == 'push'
        run: |
          echo "STAGE: $STAGE"
          cd ./cdk && IMAGE_TAG=$IMAGE_TAG npx aws-cdk deploy --all --require-approval never
